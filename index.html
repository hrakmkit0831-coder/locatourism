    document.getElementById('contact-q').addEventListener('input', function (e) { contactQuery = e.target.value; renderContactRows(); });
    renderContactRows();
    fab('/scan', '名刺を撮る', 'camera');
  }

  function renderContactRows() {
    var q = contactQuery.trim().toLowerCase();
    var rows = S.data.contacts.filter(function (c) {
      return !q || [c.name, c.companyName, c.department, c.position, c.email].join(' ').toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return compare(a, b, 'updatedAt', -1); });
    var html = '<div class="count">' + rows.length + '件</div>';
    if (!rows.length) html += '<p class="empty">該当する連絡先はありません</p>';
    rows.forEach(function (c) { html += contactItem(c, true); });
    document.getElementById('contact-list').innerHTML = '<div class="card">' + html + '</div>';
  }

  function contactItem(c, showCompany) {
    var tel = c.mobile || c.phone;
    return '<div class="item">' + editLink('contacts', c.id) + '<strong>' + esc(c.name) + '</strong> <span class="chip">' + dash(c.category) + '</span>' +
      (c.source === '名刺読み取り' ? ' <span class="chip">名刺</span>' : '') +
      '<div class="meta">' + (showCompany ? esc(c.companyName || '（所属なし）') + '　' : '') + esc([c.department, c.position].filter(Boolean).join(' ')) + '</div>' +
      '<div class="meta">' + (tel ? '<a href="tel:' + esc(tel.replace(/[^\d+]/g, '')) + '">' + esc(tel) + '</a>' : '') +
      (c.email ? (tel ? '　' : '') + '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : '') + '</div>' +
      (c.metEvent || c.metAt ? '<div class="meta">' + esc([c.metAt, c.metEvent].filter(Boolean).join('　')) + '</div>' : '') + '</div>';
  }

  /** 同じ人がすでに登録されていないか（メール一致、または氏名＋会社一致） */
  function findDuplicateContacts(data, selfId) {
    var norm = function (s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); };
    return S.data.contacts.filter(function (c) {
      if (c.id === selfId) return false;
      if (data.email && norm(c.email) === norm(data.email)) return true;
      return data.name && data.companyName && norm(c.name) === norm(data.name) && norm(c.companyName) === norm(data.companyName);
    });
  }

  // ===== 名刺を撮る（アプリ内カメラ＋枠） =====
  var cameraStream = null;
  var pendingPrefill = null;   // 読み取り結果。URL には載せない（個人情報を履歴に残さないため）
  var CARD_RATIO = 91 / 55;

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(function (t) { t.stop(); });
      cameraStream = null;
    }
    var v = document.getElementById('scan-video');
    if (v) v.srcObject = null;
  }

  function renderScan() {
    view.innerHTML = '<a class="back" href="#" data-go="/contacts">← 連絡先</a><h1>名刺を撮る</h1>' +
      '<div class="scan-box" id="scan-box">' +
      '<video id="scan-video" playsinline muted autoplay></video>' +
      '<div class="scan-frame" id="scan-frame"><span>名刺を枠に合わせてください</span></div>' +
      '<img id="scan-preview" alt="撮影した名刺" hidden>' +
      '<div class="scan-status" id="scan-status" role="status">カメラを起動しています…</div>' +
      '</div>' +
      '<div class="scan-actions" id="scan-actions">' +
      '<button type="button" class="btn btn-primary scan-shutter" id="scan-shutter" disabled>撮影</button>' +
      '<label class="btn" for="scan-file">写真を選ぶ／撮る</label>' +
      '<input type="file" id="scan-file" accept="image/*" capture="environment" hidden>' +
      '</div>' +
      '<p class="note">読み取った内容は保存前に確認画面で直せます。画像は保存しません。試作中は架空の名刺だけで試してください。</p>';

    document.getElementById('scan-shutter').addEventListener('click', captureFromVideo);
    document.getElementById('scan-file').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var img = new Image();
      img.onload = function () { useImage(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(img.src); };
      img.onerror = function () { setScanStatus('画像を読み込めませんでした', true); };
      img.src = URL.createObjectURL(f);
    });
    startCamera();
  }

  function setScanStatus(msg, isError) {
    var el = document.getElementById('scan-status');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('error-text', !!isError);
    el.hidden = !msg;
  }

  function startCamera() {
    var video = document.getElementById('scan-video');
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      cameraUnavailable('この画面ではカメラを直接使えません。');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(function (stream) {
        if (!document.getElementById('scan-video')) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        cameraStream = stream;
        video.srcObject = stream;
        video.onloadedmetadata = function () {
          video.play();
          document.getElementById('scan-shutter').disabled = false;
          setScanStatus('');
        };
      })
      .catch(function (err) {
        cameraUnavailable(err && err.name === 'NotAllowedError' ? 'カメラの使用が許可されていません。' : 'カメラを起動できませんでした。');
      });
  }

  function cameraUnavailable(reason) {
    var box = document.getElementById('scan-box');
    if (!box) return;
    box.classList.add('no-camera');
    document.getElementById('scan-shutter').hidden = true;
    setScanStatus(reason + '下の「写真を選ぶ／撮る」から撮影してください（スマホではカメラが開きます）。', false);
  }

  /** 映像から、画面上の枠に当たる部分だけを切り抜く */
  function captureFromVideo() {
    var video = document.getElementById('scan-video');
    var frame = document.getElementById('scan-frame');
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    var vr = video.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    // video は object-fit: cover で表示しているので、表示座標→映像座標の倍率とずれを求める
    var scale = Math.max(vr.width / vw, vr.height / vh);
    var offX = (vw * scale - vr.width) / 2, offY = (vh * scale - vr.height) / 2;
    var sx = (fr.left - vr.left + offX) / scale, sy = (fr.top - vr.top + offY) / scale;
    var sw = fr.width / scale, sh = fr.height / scale;
    var canvas = drawToCanvas(video, Math.max(0, sx), Math.max(0, sy), Math.min(sw, vw), Math.min(sh, vh));
    stopCamera();
    showPreviewAndRead(canvas);
  }

  /** ファイルから選んだ写真は全体を使う（向きが横倒しでも読み取りはできる） */
  function useImage(img, w, h) {
    stopCamera();
    var canvas = drawToCanvas(img, 0, 0, w, h);
    showPreviewAndRead(canvas);
  }

  function drawToCanvas(src, sx, sy, sw, sh) {
    var MAX = 1600;
    var k = Math.min(1, MAX / Math.max(sw, sh));
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(sw * k);
    canvas.height = Math.round(sh * k);
    canvas.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function showPreviewAndRead(canvas) {
    var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    var box = document.getElementById('scan-box');
    var prev = document.getElementById('scan-preview');
    if (!box || !prev) return;
    box.classList.add('captured');
    prev.src = dataUrl;
    prev.hidden = false;
    document.getElementById('scan-actions').innerHTML =
      '<button type="button" class="btn btn-primary" id="scan-read">この写真で読み取る</button>' +
      '<button type="button" class="btn" id="scan-retake">撮り直す</button>';
    setScanStatus('');
    document.getElementById('scan-retake').addEventListener('click', function () { render('/scan'); });
    document.getElementById('scan-read').addEventListener('click', function (e) {
      var btn = e.target;
      btn.disabled = true;
      btn.textContent = '読み取り中…（10〜20秒）';
      document.getElementById('scan-retake').disabled = true;
      setScanStatus('読み取っています…');
      callRaw('apiReadCard', [dataUrl.split(',')[1]], function (json) {
        var card = JSON.parse(json);
        var note = card.otherNotes ? '名刺の追記：' + card.otherNotes : '';
        pendingPrefill = {
          name: card.name, companyName: card.companyName, department: card.department, position: card.position,
          phone: card.phone, mobile: card.mobile, email: card.email, address: card.address, note: note,
          source: '名刺読み取り', metAt: S.today, category: guessCategory(card.companyName),
        };
        go('/edit/contacts/new?_prefill=1');
      }, function (msg) {
        btn.disabled = false;
        btn.textContent = 'もう一度読み取る';
        document.getElementById('scan-retake').disabled = false;
        setScanStatus(msg, true);
      });
    });
  }

  function guessCategory(company) {
    var c = String(company || '');
    if (/市|町|村|県|都|府|省|庁|協議会|協会|組合|商工会|観光/.test(c) && !/株式会社|有限会社|合同会社/.test(c)) return '自治体・団体';
    return '制作会社';
  }

  /** 保存以外のサーバー呼び出し（データの再読み込みはしない） */
  function callRaw(fn, args, onOk, onNg) {
    if (!(typeof google !== 'undefined' && google.script && google.script.run)) { onNg('この画面では使えません（Apps Script の外で開かれています）'); return; }
    var runner = google.script.run
      .withSuccessHandler(onOk)
      .withFailureHandler(function (err) { onNg(err && err.message ? err.message : String(err)); });
    runner[fn].apply(runner, args);
  }

  // ===== マスタ（ロケ地・制作会社） =====
  function renderMaster() {
    var locs = S.data.locations.slice().sort(function (a, b) { return compare(a, b, 'id', 1); });
    var comps = S.data.companies.slice().sort(function (a, b) { return compare(a, b, 'id', 1); });
    var html = '<h1>ロケ地・制作会社</h1>';
    var issues = S.issues || [];
    html += '<section class="card" id="data-check"><div class="sec-head"><h2>データ点検（' + (issues.length ? issues.length + '件' : '問題なし') + '）</h2>' +
      (S.sheetUrl ? '<a class="btn btn-small" href="' + esc(S.sheetUrl) + '" target="_blank" rel="noopener">シートを開く ↗</a>' : '') + '</div>';
    if (!issues.length) {
      html += '<p class="empty" style="margin:0">シートの番号・選択肢・参照に問題は見つかりませんでした。</p>';
    } else {
      html += '<p class="note" style="margin-top:0">シートを直接編集したときに起きやすい不整合です。アプリからは自動で直さないので、シートか各画面の「編集」で直してください。</p>';
      issues.slice(0, 50).forEach(function (i) {
        var route = { inquiries: '/inquiries/', projects: '/projects/', scouts: '/scouts/' }[i.table];
        var editable = S.editable[i.table] && S.data[i.table].filter(function (r) { return r.id === i.id; }).length === 1;
        html += '<div class="item"><strong>' + esc(i.sheet) + '</strong> ' + esc(i.row) + '行目' + (i.id ? '（' + esc(i.id) + '）' : '') +
          (editable ? ' <a href="#" data-go="' + esc(route ? route + i.id : '/edit/' + i.table + '/' + i.id) + '">開く</a>' : '') +
          '<div class="meta">' + esc(i.message) + '</div></div>';
      });
      if (issues.length > 50) html += '<p class="note">ほか ' + (issues.length - 50) + ' 件</p>';
    }
    html += '</section>';
    html += '<section class="card">' + secHead('ロケ地（' + locs.length + 'か所）', '/edit/locations/new');
    locs.forEach(function (l) {
      html += '<div class="item">' + editLink('locations', l.id) + '<strong>' + esc(l.name) + '</strong> <span class="chip">' + dash(l.category) + '</span>' +
        '<div class="meta">' + esc(l.id) + '／' + dash(l.address) + '／' + dash(l.contact) + '</div>' +
        (l.conditions ? '<div class="meta">撮影条件：' + esc(l.conditions) + '</div>' : '') + '</div>';
    });
    html += '</section><section class="card">' + secHead('制作会社（' + comps.length + '社）', '/edit/companies/new');
    comps.forEach(function (c) {
      html += '<div class="item">' + editLink('companies', c.id) + '<strong>' + esc(c.name) + '</strong>' +
        '<div class="meta">' + esc(c.id) + '／' + dash(c.contactName) + '／' + dash(c.email) + '／' + dash(c.phone) + '</div>' +
        (c.note ? '<div class="meta">' + esc(c.note) + '</div>' : '') + '</div>';
    });
    html += '</section>';
    view.innerHTML = html;
  }

  // ===== 登録・編集フォーム（Phase 5） =====
  var FORM_TITLE = { inquiries: '問い合わせ', projects: '案件', activities: '対応履歴', scouts: 'ロケハン', contacts: '連絡先', shootPlans: '撮影計画', results: '撮影実績', locations: 'ロケ地', companies: '制作会社' };
  var AUTO_KEYS = ['id', 'createdAt', 'updatedAt'];
  var TEXT_SUGGEST = { assignee: true, contactName: false };

  function nowStr() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function toInputDate(v) { return v ? String(v).slice(0, 10).replace(/\//g, '-') : ''; }
  function toInputDateTime(v) { return v ? String(v).slice(0, 16).replace(/\//g, '-').replace(' ', 'T') : ''; }

  function backRouteOf(table, rec, query) {
    if (!(rec && rec.id) && query && query._fromMailId) return '/mail/' + query._fromMailId;
    if (table === 'inquiries') return rec && rec.id ? '/inquiries/' + rec.id : (query.projectId ? '/projects/' + query.projectId : '/inquiries');
    if (table === 'projects') return rec && rec.id ? '/projects/' + rec.id : (query._fromInquiryId ? '/inquiries/' + query._fromInquiryId : '/projects');
    if (table === 'locations' || table === 'companies') return '/master';
    if (table === 'contacts') return '/contacts';
    if (table === 'scouts') return rec && rec.id ? '/scouts/' + rec.id : (query.projectId ? '/projects/' + query.projectId : '/scouts');
    var pid = (rec && rec.projectId) || query.projectId;
    if (pid) return '/projects/' + pid;
    var iid = (rec && rec.inquiryId) || query.inquiryId;
    return iid ? '/inquiries/' + iid : '/projects';
  }

  function renderForm(table, id, query) {
    var sch = S.schema[table], ed = S.editable[table];
    if (!sch || !ed) { view.innerHTML = '<p class="error">このデータは画面から編集できません</p>'; return; }
    var isNew = id === 'new';
    var rec = {};
    if (isNew) {
      Object.keys(ed.defaults).forEach(function (k) { rec[k] = ed.defaults[k] === '__now' ? nowStr() : ed.defaults[k]; });
      Object.keys(query).forEach(function (k) { if (k !== '_prefill') rec[k] = query[k]; });
      if (query._prefill && pendingPrefill) Object.keys(pendingPrefill).forEach(function (k) { rec[k] = pendingPrefill[k]; });
      if (query._fromMailId) {
        var mp = prefillFromMail(table, query._fromMailId);
        Object.keys(mp).forEach(function (k) { if (!query[k]) rec[k] = mp[k]; });
      }
    } else {
      var found = S.data[table].filter(function (r) { return r.id === id; })[0];
      if (!found) { view.innerHTML = '<a class="back" href="#" data-go="/">← 戻る</a><p class="error">' + esc(id) + ' が見つかりません</p>'; return; }
      rec = Object.assign({}, found);
    }
    var back = backRouteOf(table, isNew ? null : rec, query);

    var html = '<a class="back" href="#" data-go="' + esc(back) + '">← 戻る</a>' +
      '<h1>' + esc(FORM_TITLE[table]) + (isNew ? 'を登録' : 'を編集') + '</h1>' +
      (isNew ? '' : '<div class="sub">' + esc(id) + '</div>') +
      '<form id="edit-form" class="card form" novalidate data-table="' + table + '" data-id="' + esc(id) + '" data-back="' + esc(back) + '">' +
      '<div class="form-error" id="form-error" role="alert" hidden></div>';

    if (query._prefill && pendingPrefill) {
      html += '<div class="next-action" style="margin-top:0"><div class="label">名刺から読み取りました</div>読み間違いがないか確認してから保存してください。' +
        '<div class="actions" style="margin:8px 0 0"><a class="btn btn-small" href="#" data-go="/scan">撮り直す</a></div></div>';
    }
    if (query._fromMailId) {
      var srcMail = S.data.mailInbox.filter(function (x) { return x.id === query._fromMailId; })[0];
      if (srcMail && (srcMail.aiCategory || srcMail.aiSummary)) {
        html += '<div class="next-action" style="margin-top:0"><div class="label">AI下書きを使って入力しています</div>作品名・会社・分類などはAIの推定です。本文と見比べてから保存してください。</div>';
      }
      html += '<p class="note" style="margin-top:0">受信メール ' + esc(query._fromMailId) + ' から作成しています。保存すると、このメールは「' +
        (table === 'inquiries' ? '問い合わせ登録済み' : '対応履歴に追加済み') + '」になります。</p>' +
        '<input type="hidden" name="_fromMailId" value="' + esc(query._fromMailId) + '">';
    }
    if (query._fromInquiryId) {
      html += '<p class="note" style="margin-top:0">保存すると、問い合わせ ' + esc(query._fromInquiryId) + ' がこの案件に紐付きます。</p>' +
        '<input type="hidden" name="_fromInquiryId" value="' + esc(query._fromInquiryId) + '">';
    }

    sch.columns.forEach(function (c) {
      if (AUTO_KEYS.indexOf(c.key) >= 0) return;
      if (c.key === 'companyId' && (table === 'inquiries' || table === 'projects' || table === 'contacts')) return; // 会社名から自動で付く
      html += fieldHtml(table, c, rec[c.key], ed.required.indexOf(c.key) >= 0);
      if (table === 'shootPlans' && c.key === 'headcount') html += planLocationsField(isNew ? [] : (S.groups.locsByPlan[id] || []).map(function (x) { return x.locationId; }));
      if (table === 'scouts' && c.key === 'companions') html += scoutLocationsField(isNew ? [] : (S.groups.scoutLocsByScout[id] || []));
    });

    html += '<div class="form-actions"><button type="submit" class="btn btn-primary">保存</button>' +
      '<a class="btn" href="#" data-go="' + esc(back) + '">キャンセル</a></div></form>';
    view.innerHTML = html;

    var form = document.getElementById('edit-form');
    form.addEventListener('submit', onSubmitForm);
    var companyInput = form.querySelector('[name="companyName"]');
    if (companyInput) {
      var hint = document.getElementById('company-hint');
      var updateHint = function () {
        var v = companyInput.value.replace(/\s+/g, '');
        var hit = v && S.data.companies.some(function (c) { return c.name.replace(/\s+/g, '') === v; });
        hint.textContent = !v ? '登録済みの会社は入力すると候補に出ます' : hit ? '登録済みの制作会社に紐付きます' : '未登録の会社として保存します（あとで「ロケ地・会社」から登録できます）';
      };
      companyInput.addEventListener('input', updateHint);
      updateHint();
    }
    var checks = form.querySelectorAll('.scout-loc input[type=checkbox]');
    Array.prototype.forEach.call(checks, function (cb) {
      var sync = function () {
        cb.closest('.scout-loc').classList.toggle('on', cb.checked);
        Array.prototype.forEach.call(cb.closest('.scout-loc').querySelectorAll('select, input[type=text]'), function (el) { el.disabled = !cb.checked; });
      };
      cb.addEventListener('change', sync);
      sync();
    });
  }

  function scoutLocationsField(current) {
    var byLoc = {};
    current.forEach(function (x) { byLoc[x.locationId] = x; });
    var locs = S.data.locations.slice().sort(function (a, b) {
      var x = byLoc[a.id] ? 0 : 1, y = byLoc[b.id] ? 0 : 1;   // 選択済みを上に
      return x - y || compare(a, b, 'id', 1);
    });
    return '<fieldset class="field"><legend>回るロケ地と評価（複数選べます）</legend><div class="scout-locs">' +
      locs.map(function (l) {
        var cur = byLoc[l.id];
        return '<div class="scout-loc" data-loc="' + esc(l.id) + '"><label class="scout-loc-name"><input type="checkbox" value="' + esc(l.id) + '"' + (cur ? ' checked' : '') + '> ' + esc(l.name) + '</label>' +
          '<div class="scout-loc-eval"><select aria-label="' + esc(l.name) + 'の評価">' + S.enums['ロケハン評価'].map(function (e) {
            return '<option' + ((cur ? cur.evaluation : '未評価') === e ? ' selected' : '') + '>' + esc(e) + '</option>';
          }).join('') + '</select><input type="text" placeholder="先方の反応（任意）" aria-label="' + esc(l.name) + 'での先方の反応" value="' + esc(cur ? cur.reaction : '') + '"></div></div>';
      }).join('') + '</div><a class="note" href="#" data-go="/edit/locations/new">ロケ地を新しく登録する</a></fieldset>';
  }

  function fieldHtml(table, c, value, required) {
    var fid = 'f-' + c.key;
    var v = value == null ? '' : value;
    var attrs = ' id="' + fid + '" name="' + c.key + '"' + (required ? ' required aria-required="true"' : '');
    var input;
    if (c.type.indexOf('enum:') === 0) {
      var list = S.enums[c.type.slice(5)];
      input = '<select' + attrs + '><option value="">' + (required ? '（選んでください）' : '（未選択）') + '</option>' +
        list.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    } else if (c.type.indexOf('ref:') === 0) {
      input = '<select' + attrs + '><option value="">' + (required ? '（選んでください）' : '（選ばない）') + '</option>' + refOptions(c.type.slice(4), v) + '</select>';
    } else if (c.type === 'date') {
      input = '<input type="date"' + attrs + ' value="' + esc(toInputDate(v)) + '">';
    } else if (c.type === 'datetime') {
      input = '<input type="datetime-local"' + attrs + ' value="' + esc(toInputDateTime(v)) + '">';
    } else if (c.type === 'int' || c.type === 'yen') {
      input = '<input type="number" min="0" step="1" inputmode="numeric"' + attrs + ' value="' + esc(v) + '">' + (c.type === 'yen' ? '<span class="suffix">円</span>' : '');
    } else if (c.type === 'longtext') {
      input = '<textarea rows="3"' + attrs + '>' + esc(v) + '</textarea>';
    } else {
      var isCompany = c.key === 'companyName';
      var listId = (TEXT_SUGGEST[c.key] || isCompany) ? 'dl-' + c.key : '';
      var inputType = c.key === 'email' ? 'email' : 'text';
      input = '<input type="' + inputType + '"' + attrs + ' value="' + esc(v) + '"' + (listId ? ' list="' + listId + '" autocomplete="off"' : '') +
        (inputType === 'email' ? ' inputmode="email" autocomplete="off" placeholder="name@example.com"' : '') + '>';
      var suggestions = isCompany
        ? uniq(S.data.companies.map(function (x) { return x.name; }).concat(knownValues('companyName'))).sort()
        : (listId ? knownValues(c.key) : []);
      if (listId) input += '<datalist id="' + listId + '">' + suggestions.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>';
      if (isCompany) input += '<div class="note" id="company-hint" style="margin-top:4px"></div>';
    }
    return '<div class="field"><label for="' + fid + '">' + esc(c.label) + (required ? '<span class="req">必須</span>' : '') + '</label>' + input + '</div>';
  }

  function refOptions(ref, selected) {
    var rows = (S.data[ref] || []).slice();
    var labelOf = {
      projects: function (r) { return r.id + '　' + r.title; },
      inquiries: function (r) { return r.id + '　' + (r.title || r.companyName); },
      companies: function (r) { return r.name; },
      locations: function (r) { return r.name; },
      shootPlans: function (r) { return r.id + '　' + r.shootDate; },
    }[ref] || function (r) { return r.id; };
    var dir = (ref === 'companies' || ref === 'locations') ? 1 : -1;
    rows.sort(function (a, b) { return compare(a, b, 'id', dir); });
    return rows.map(function (r) {
      return '<option value="' + esc(r.id) + '"' + (r.id === selected ? ' selected' : '') + '>' + esc(labelOf(r)) + '</option>';
    }).join('');
  }

  function knownValues(key) {
    var all = [];
    ['inquiries', 'projects', 'activities'].forEach(function (t) {
      S.data[t].forEach(function (r) { if (r[key]) all.push(r[key]); });
    });
    return uniq(all).sort();
  }

  function planLocationsField(selectedIds) {
    var locs = S.data.locations.slice().sort(function (a, b) { return compare(a, b, 'id', 1); });
    return '<fieldset class="field checks"><legend>ロケ地（複数選べます）</legend><div class="check-grid">' +
      locs.map(function (l) {
        return '<label><input type="checkbox" name="locationIds" value="' + esc(l.id) + '"' + (selectedIds.indexOf(l.id) >= 0 ? ' checked' : '') + '> ' + esc(l.name) + '</label>';
      }).join('') + '</div><a class="note" href="#" data-go="/edit/locations/new">ロケ地を新しく登録する</a></fieldset>';
  }

  function onSubmitForm(e) {
    e.preventDefault();
    var form = e.target;
    var table = form.getAttribute('data-table');
    var id = form.getAttribute('data-id');
    var data = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name || el.type === 'submit') return;
      if (el.name === 'locationIds') {
        data.locationIds = data.locationIds || [];
        if (el.checked) data.locationIds.push(el.value);
        return;
      }
      data[el.name] = el.value;
    });
    if (table === 'shootPlans' && !data.locationIds) data.locationIds = [];
    if (table === 'scouts') {
      data.locations = [];
      Array.prototype.forEach.call(form.querySelectorAll('.scout-loc'), function (row) {
        if (!row.querySelector('input[type=checkbox]').checked) return;
        data.locations.push({
          locationId: row.getAttribute('data-loc'),
          evaluation: row.querySelector('select').value,
          reaction: row.querySelector('input[type=text]').value,
        });
      });
    }

    var missing = S.editable[table].required.filter(function (k) { return !data[k]; }).map(function (k) {
      var c = S.schema[table].columns.filter(function (x) { return x.key === k; })[0];
      return c ? c.label : k;
    });
    if (missing.length) return showFormError('入力されていない項目があります：' + missing.join('、'));

    if (table === 'contacts' && form.getAttribute('data-dup-ok') !== '1') {
      var dups = findDuplicateContacts(data, id === 'new' ? '' : id);
      if (dups.length) {
        form.setAttribute('data-dup-ok', '1');
        form.querySelector('button[type="submit"]').textContent = 'それでも保存する';
        return showFormError('同じ人がすでに登録されているかもしれません：' + dups.map(function (c) {
          return c.id + ' ' + c.name + '（' + (c.companyName || '所属なし') + '）';
        }).join('、') + '。別の人なら、もう一度「それでも保存する」を押してください。');
      }
    }

    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = '保存中…';
    callServer('apiSave', [table, id === 'new' ? '' : id, JSON.stringify(data)], function (res) {
      if (table === 'contacts') pendingPrefill = null;
      toast('保存しました（' + res.id + '）');
      var saved = S.data[table].filter(function (r) { return r.id === res.id; })[0];
      go(backRouteOf(table, saved, {}));
    }, function (msg) {
      btn.disabled = false;
      btn.textContent = '保存';
      showFormError(msg);
    });
  }

  function showFormError(msg) {
    var el = document.getElementById('form-error');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    el.scrollIntoView({ block: 'center' });
  }

  /** サーバーの登録・更新を呼び、返ってきた最新データで描き直す */
  function callServer(fn, args, onOk, onNg) {
    if (!(typeof google !== 'undefined' && google.script && google.script.run)) {
      onNg('この画面では保存できません（Apps Script の外で開かれています）');
      return;
    }
    var runner = google.script.run
      .withSuccessHandler(function (json) {
        var res = JSON.parse(json);
        loadData(res.bootstrap);
        onOk(res);
      })
      .withFailureHandler(function (err) {
        var msg = err && err.message ? err.message : String(err);
        if (/permission|権限がありません|do not have/i.test(msg)) msg = '保存する権限がありません（スプレッドシートが「閲覧者」として共有されています）。登録・編集が必要なら、管理者に「編集者」での共有を依頼してください。';
        onNg(msg);
      });
    runner[fn].apply(runner, args);
  }

  // ===== イベント =====
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-action="logout"]')) {
      if (window.confirm('この端末からログアウトします。もう一度使うには新しい招待コードが必要です。よろしいですか？')) window.__lt.logout();
      return;
    }
    if (e.target.closest('[data-action="copy-invite"]')) {
      var code = document.getElementById('invite-code').textContent;
      var copied = function () { toast('招待コードをコピーしました'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(copied, copied); else copied();
      return;
    }
    var rv = e.target.closest('[data-action="revoke-user"]');
    if (rv) {
      var em = rv.getAttribute('data-email');
      if (!window.confirm(em + ' の利用を取り消し、すべての端末をログアウトさせます。よろしいですか？')) return;
      rv.disabled = true;
      callRaw('adminRevokeUser', [em], function () { toast('取り消しました'); loadUserList(); }, function (msg) { rv.disabled = false; window.alert(msg); });
      return;
    }
    var ft = e.target.closest('[data-action="toggle-filters"]');
    if (ft) {
      var box = ft.closest('.filters');
      var open = !box.classList.contains('open');
      box.classList.toggle('open', open);
      ft.setAttribute('aria-expanded', String(open));
      return;
    }
    var draftBtn = e.target.closest('[data-action="mail-draft"]');
    if (draftBtn) {
      var dmid = draftBtn.getAttribute('data-mail');
      draftBtn.disabled = true;
      draftBtn.textContent = '作成中…（10〜20秒）';
      callServer('apiMailDraft', [dmid], function () {
        toast('AI下書きを作りました');
        render('/mail/' + dmid);
      }, function (msg) {
        draftBtn.disabled = false;
        draftBtn.textContent = 'AIで下書きを作る';
        window.alert('下書きを作れませんでした：' + msg);
      });
      return;
    }
    if (e.target.closest('[data-action="copy-reply"]')) {
      var ta = document.getElementById('ai-reply');
      var done = function () { toast('返信の文案をコピーしました'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); document.execCommand('copy'); done(); });
      } else {
        ta.select(); document.execCommand('copy'); done();
      }
      return;
    }
    var mailBtn = e.target.closest('[data-action="mail-status"]');
    if (mailBtn) {
      var mid = mailBtn.getAttribute('data-mail'), op = mailBtn.getAttribute('data-op');
      if (op === 'ignore' && !window.confirm('このメールを「対象外」にします（あとで未確認に戻せます）。よろしいですか？')) return;
      mailBtn.disabled = true;
      callServer('apiMailStatus', [mid, op], function () {
        toast(op === 'ignore' ? '対象外にしました' : '未確認に戻しました');
        if (op === 'ignore') go('/mail'); else render('/mail/' + mid);
      }, function (msg) {
        mailBtn.disabled = false;
        window.alert('できませんでした：' + msg);
      });
      return;
    }
    var action = e.target.closest('[data-action="change-status"]');
    if (action) {
      var sel = document.getElementById('status-select');
      var table = action.getAttribute('data-table'), id = action.getAttribute('data-id');
      var current = (S.data[table].filter(function (r) { return r.id === id; })[0] || {}).status;
      if (sel.value === current) { toast('ステータスは変わっていません'); return; }
      if (!window.confirm('ステータスを「' + current + '」から「' + sel.value + '」に変更します。よろしいですか？')) return;
      action.disabled = true;
      callServer('apiChangeStatus', [table, id, sel.value], function () {
        toast('ステータスを「' + sel.value + '」に変更しました');
        render((table === 'projects' ? '/projects/' : '/inquiries/') + id);
      }, function (msg) {
        action.disabled = false;
        window.alert('変更できませんでした：' + msg);
      });
      return;
    }
    var sortBtn = e.target.closest('[data-sort]');
    if (sortBtn) {
      var s = sortBtn.getAttribute('data-sort').split(':');
      var st = listState[s[0]];
      if (st.sort === s[1]) st.dir = -st.dir; else { st.sort = s[1]; st.dir = 1; }
      (s[0] === 'inquiries' ? renderInquiryRows : renderProjectRows)();
      return;
    }
    var yearBtn = e.target.closest('.year-select [data-year]');
    if (yearBtn) { resultsYear = yearBtn.getAttribute('data-year'); renderResults(); return; }

    var link = e.target.closest('[data-go]');
    if (link) {
      e.preventDefault();
      if (link.hasAttribute('data-year')) resultsYear = link.getAttribute('data-year');
      go(link.getAttribute('data-go'));
      return;
    }
    var tab = e.target.closest('.tabs a');
    if (tab) {
      e.preventDefault();
      var t = tab.getAttribute('data-tab');
      go(t === 'dashboard' ? '/' : '/' + t);
    }
  });

  function onFilter(e) {
    var el = e.target.closest('[data-filter]');
    if (!el) return;
    var f = el.getAttribute('data-filter').split(':');
    listState[f[0]][f[1]] = el.value;
    (f[0] === 'inquiries' ? renderInquiryRows : renderProjectRows)();
  }
  document.addEventListener('input', onFilter);
  document.addEventListener('change', onFilter);

  // ===== 起動 =====
  function loadData(json) {
    S = typeof json === 'string' ? JSON.parse(json) : json;
    ['projects', 'inquiries', 'locations', 'companies'].forEach(function (k) { IDX[k] = by('id')(S.data[k]); });
    S.groups = {
      inquiriesByProject: group(S.data.inquiries, 'projectId'),
      activitiesByProject: group(S.data.activities, 'projectId'),
      activitiesByInquiry: group(S.data.activities, 'inquiryId'),
      plansByProject: group(S.data.shootPlans, 'projectId'),
      resultsByProject: group(S.data.results, 'projectId'),
      locsByPlan: group(S.data.planLocations, 'planId'),
      historyByTarget: group(S.data.statusHistory, 'targetId'),
      scoutsByProject: group(S.data.scouts, 'projectId'),
      scoutLocsByScout: group(S.data.scoutLocations, 'scoutId'),
    };
  }

  function boot(json) {
    loadData(json);
    var sheetLink = document.getElementById('sheet-link');
    if (sheetLink && S.sheetUrl) { sheetLink.href = S.sheetUrl; sheetLink.hidden = false; }
    // アプリ名はサーバーから受け取る（公開している画面のコードには自治体名を書かない）
    var title = document.querySelector('.app-title');
    if (title && S.app && S.app.name && title.firstChild && title.firstChild.nodeType === 3) title.firstChild.nodeValue = S.app.name;
    if (S.me) document.body.classList.toggle('role-viewer', S.me.role === 'viewer');
    if (hasHistory) {
      google.script.history.setChangeHandler(function (e) { render((e.state && e.state.route) || '/'); });
      google.script.url.getLocation(function (loc) { render(loc.hash || '/'); });
    } else {
      window.addEventListener('hashchange', function () { render(location.hash || '/'); });
      render(location.hash || '/');
    }
  }

  function fail(err) {
    var msg = err && err.message ? err.message : String(err);
    if (/permission|権限|access|アクセス/i.test(msg)) {
      view.innerHTML = '<div class="error">このアプリのスプレッドシートを開く権限がありません。<br>管理者（ロケツーリズム担当）に、いまログインしているGoogleアカウントへの共有を依頼してください。</div>' +
        '<p class="note">詳細：' + esc(msg) + '</p>';
      return;
    }
    view.innerHTML = '<div class="error">データを読み込めませんでした：' + esc(msg) + '</div>';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(boot).withFailureHandler(fail).apiBootstrap();
  } else {
    fail('Apps Script の外で開かれています');
  }
})();
</script>

</body>
</html>
