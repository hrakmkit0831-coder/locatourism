<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#1d4f7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ロケ管理">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>ロケツーリズム管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #d9dde3;
    --text: #1f2933;
    --muted: #5f6b7a;
    --accent: #1d4f7a;
    --accent-soft: #e6eef6;
    --warn-bg: #fff4d6;
    --warn-text: #6b4e00;

    --st-consult-bg: #e3edf8;  --st-consult-fg: #1d4f7a;  /* 相談・調整 */
    --st-decided-bg: #fde8c8;  --st-decided-fg: #7a4a00;  /* 撮影決定・準備 */
    --st-shot-bg: #dcf1e6;     --st-shot-fg: #155c38;     /* 実施済み・実績確認 */
    --st-done-bg: #e7e9ec;     --st-done-fg: #3c4652;     /* 完了 */
    --st-hold-bg: #f1ecf7;     --st-hold-fg: #5a3f7a;     /* 保留 */
    --st-stop-bg: #f8e3e3;     --st-stop-fg: #8a2525;     /* 見送り・中止 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --surface: #1c2229; --border: #313a44; --text: #e4e8ec; --muted: #9aa5b1;
      --accent: #8fbbe3; --accent-soft: #22303d; --warn-bg: #3a3014; --warn-text: #f1d892;
      --st-consult-bg: #1f3247; --st-consult-fg: #a9cbee;
      --st-decided-bg: #45331a; --st-decided-fg: #f4c98a;
      --st-shot-bg: #1c3b2b;    --st-shot-fg: #9fdcbb;
      --st-done-bg: #2b3138;    --st-done-fg: #c3cad2;
      --st-hold-bg: #33294a;    --st-hold-fg: #cdb8ec;
      --st-stop-bg: #4a2323;    --st-stop-fg: #f2b0b0;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  a { color: var(--accent); }

  .env-banner { background: var(--warn-bg); color: var(--warn-text); font-size: 12px; padding: 4px 16px; text-align: center; }

  .app-header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .app-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px 2px; }
  .app-title { font-weight: 700; font-size: 16px; }
  #sheet-link[hidden] { display: none; }

  /* ロケハンのロケ地と評価 */
  .scout-locs { display: grid; gap: 6px; }
  .scout-loc { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .scout-loc.on { border-color: var(--accent); background: var(--accent-soft); }
  .form .scout-loc-name { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; min-height: 36px; margin: 0; }
  .form .scout-loc-name input { width: 18px; height: 18px; }
  .scout-loc-eval { display: none; gap: 6px; margin: 4px 0 4px 26px; }
  .scout-loc.on .scout-loc-eval { display: grid; grid-template-columns: 8.5em 1fr; }
  .form .scout-loc-eval select, .form .scout-loc-eval input { min-height: 40px; }
  .tabs { display: flex; overflow-x: auto; padding: 0 8px; }
  .tabs a {
    flex: 0 0 auto; padding: 10px 12px; text-decoration: none; color: var(--muted);
    border-bottom: 3px solid transparent; font-size: 14px; white-space: nowrap;
  }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

  .view { max-width: 1080px; margin: 0 auto; padding: 16px; }
  .loading, .empty { color: var(--muted); }
  .error { background: var(--st-stop-bg); color: var(--st-stop-fg); padding: 12px 16px; border-radius: 6px; }

  h1 { font-size: 20px; margin: 4px 0 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }

  /* 数値タイル */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (min-width: 720px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; text-decoration: none; color: inherit; display: block; }
  .tile .label { font-size: 13px; color: var(--muted); }
  .tile .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile .unit { font-size: 13px; color: var(--muted); margin-left: 2px; font-weight: 400; }
  .tile.attention { border-color: var(--st-decided-fg); }
  a.tile:hover { border-color: var(--accent); }

  /* ステータス表示 */
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .st-consult { background: var(--st-consult-bg); color: var(--st-consult-fg); }
  .st-decided { background: var(--st-decided-bg); color: var(--st-decided-fg); }
  .st-shot    { background: var(--st-shot-bg);    color: var(--st-shot-fg); }
  .st-done    { background: var(--st-done-bg);    color: var(--st-done-fg); }
  .st-hold    { background: var(--st-hold-bg);    color: var(--st-hold-fg); }
  .st-stop    { background: var(--st-stop-bg);    color: var(--st-stop-fg); }

  /* 絞り込み */
  .filters { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
  @media (min-width: 720px) { .filters { grid-template-columns: 2fr 1fr 1fr 1fr; } }
  .filters input, .filters select {
    width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); min-height: 40px;
  }
  .count { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  /* 一覧：スマホはカード、PCは表 */
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { margin-bottom: 8px; }
  .row-card {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; text-decoration: none; color: inherit;
  }
  .row-card:hover { border-color: var(--accent); }
  .row-card .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .row-card .title { font-weight: 700; }
  .row-card .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .table-wrap { display: none; }
  @media (min-width: 900px) {
    .list.responsive { display: none; }
    .table-wrap { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--accent-soft); font-weight: 600; white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--accent); }
  th .arrow { font-size: 11px; color: var(--muted); margin-left: 2px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--accent-soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .nowrap { white-space: nowrap; }

  /* 詳細画面 */
  .back { display: inline-block; margin-bottom: 8px; font-size: 14px; }
  .detail-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
  .detail-head h1 { margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .next-action { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .next-action .label { font-size: 12px; font-weight: 700; }
  dl.kv { display: grid; grid-template-columns: 7.5em 1fr; gap: 4px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 13px; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .grid-2 > *, .tiles > * { min-width: 0; }
  .grid-2 { margin-bottom: 16px; }
  .grid-2 > .card { margin-bottom: 0; }
  @media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .item { border-top: 1px solid var(--border); padding: 10px 0; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item .meta { font-size: 13px; color: var(--muted); }
  .item .body { white-space: pre-wrap; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin: 2px 4px 2px 0; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .timeline li:first-child { border-top: 0; }

  /* 実績画面 */
  .year-select { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .year-select button {
    font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; min-height: 36px;
  }
  .year-select button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .bars { list-style: none; padding: 0; margin: 0; }
  .bars li { display: grid; grid-template-columns: minmax(7em, 40%) 1fr 2.5em; gap: 8px; align-items: center; padding: 4px 0; font-size: 14px; }
  .bars .bar { height: 12px; background: var(--accent); border-radius: 0 3px 3px 0; min-width: 2px; }
  .bars .n { text-align: right; font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ボタン・操作 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font: inherit; font-size: 14px; padding: 8px 14px; min-height: 40px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--accent); text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
  .btn-small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .page-head { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .page-head h1 { margin: 4px 0; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sec-head h2 { margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .status-change { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .status-change select {
    font: inherit; font-size: 14px; padding: 6px 8px; min-height: 40px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text);
  }
  .edit-link { float: right; font-size: 13px; margin-left: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* フォーム */
  .form .field { margin-bottom: 14px; border: 0; padding: 0; }
  .form label, .form legend { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .form .req { font-size: 11px; color: var(--st-stop-fg); background: var(--st-stop-bg); border-radius: 3px; padding: 0 5px; margin-left: 6px; font-weight: 700; }
  .issue-banner {
    display: block; background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--st-decided-fg);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; text-decoration: none;
  }
  .form input[type="text"], .form input[type="email"], .form input[type="number"], .form input[type="date"], .form input[type="datetime-local"],
  .form select, .form textarea {
    width: 100%; font: inherit; font-size: 16px; /* iPhoneで拡大されないよう16px */
    padding: 8px 10px; min-height: 44px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text);
  }
  .form input[type="number"] { max-width: 14em; }
  .form textarea { min-height: 88px; resize: vertical; }
  .form .suffix { margin-left: 6px; color: var(--muted); }
  .form .check-grid { display: grid; grid-template-columns: 1fr; gap: 2px 16px; }
  @media (min-width: 720px) { .form .check-grid { grid-template-columns: 1fr 1fr; } }
  .form .check-grid label { font-weight: 400; font-size: 15px; display: flex; gap: 8px; align-items: center; min-height: 36px; margin: 0; }
  .form .check-grid input { width: 18px; height: 18px; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 4px; border-top: 1px solid var(--border); }
  .form-actions .btn { min-width: 7em; min-height: 44px; }
  .form-error { background: var(--st-stop-bg); color: var(--st-stop-fg); padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; font-weight: 600; }
  .form-error[hidden] { display: none; }

  .mail-body { white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; font-size: 15px; }

  .ai-card { border-left: 4px solid var(--accent); }
  .ai-h { font-size: 14px; margin: 12px 0 4px; }
  .ai-list { margin: 0; padding-left: 1.4em; }
  .ai-reply { width: 100%; font: inherit; font-size: 15px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); resize: vertical; }

  /* 名刺撮影 */
  .scan-box { position: relative; width: 100%; max-width: 640px; aspect-ratio: 3 / 4; margin: 0 auto 12px; background: #000; border-radius: 10px; overflow: hidden; }
  @media (min-width: 720px) { .scan-box { aspect-ratio: 4 / 3; } }
  .scan-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; left: 7%; right: 7%; top: 50%; transform: translateY(-50%); aspect-ratio: 91 / 55;
    border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .scan-frame span { color: #fff; font-size: 13px; transform: translateY(calc(100% + 10px)); text-shadow: 0 1px 2px #000; }
  .scan-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #111; }
  .scan-box.captured video, .scan-box.captured .scan-frame { display: none; }
  .scan-box.no-camera { aspect-ratio: auto; min-height: 160px; background: var(--accent-soft); }
  .scan-box.no-camera video, .scan-box.no-camera .scan-frame { display: none; }
  .scan-box.no-camera.captured { aspect-ratio: 91 / 55; background: #111; }
  .scan-status { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(0, 0, 0, .7); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .scan-box.no-camera .scan-status { position: static; margin: 16px; background: transparent; color: var(--text); padding: 0; }
  .scan-status[hidden] { display: none; }
  .scan-status.error-text { background: var(--st-stop-bg); color: var(--st-stop-fg); }
  .scan-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .scan-actions .btn { min-height: 48px; min-width: 9em; font-size: 16px; }
  .scan-shutter[hidden] { display: none; }

  /* ===== 読み込み中の骨組み ===== */
  .skeleton { padding-top: 4px; }
  .sk { background: linear-gradient(90deg, var(--border) 25%, var(--accent-soft) 50%, var(--border) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 8px; opacity: .6; }
  .sk-title { height: 26px; width: 40%; margin-bottom: 16px; }
  .sk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .sk-tile { height: 74px; }
  .sk-card { height: 120px; margin-bottom: 12px; }
  @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ===== メニュー画面 ===== */
  .menu-list { list-style: none; margin: 0 0 12px; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .menu-list li + li { border-top: 1px solid var(--border); }
  .menu-list a { display: flex; flex-direction: column; padding: 14px 40px 14px 16px; text-decoration: none; color: var(--text); position: relative; min-height: 56px; justify-content: center; }
  .menu-list a::after { content: '›'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 22px; }
  .menu-me { display: flex; flex-direction: column; padding: 14px 16px; }
  .menu-logout { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 16px; color: #d64545; font-weight: 600; cursor: pointer; text-align: center; }
  .invite-code { font-size: 28px; font-weight: 700; letter-spacing: .12em; font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--text); }
  .menu-title { font-weight: 600; }
  .menu-sub { font-size: 13px; color: var(--muted); }

  /* ===== スマホ用の外枠（PCでは出さない） ===== */
  .env-pill { display: none; font-size: 11px; font-weight: 700; color: var(--warn-text); background: var(--warn-bg); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; }
  .bottom-nav, .fab, .filter-toggle { display: none; }

  @media (max-width: 719px) {
    html { -webkit-text-size-adjust: 100%; }
    body { -webkit-tap-highlight-color: transparent; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    body.focus-mode { padding-bottom: env(safe-area-inset-bottom); }

    .env-banner { display: none; }
    .env-pill { display: inline-block; }
    .tabs { display: none; }
    .app-header { box-shadow: 0 1px 0 var(--border); border-bottom: 0; padding-top: env(safe-area-inset-top); }
    .app-top { padding: 10px 16px; }
    .app-title { font-size: 15px; }
    #sheet-link { display: none; }
    .view { padding: 14px 16px 24px; }
    h1 { font-size: 22px; }

    .bottom-nav {
      display: grid; grid-template-columns: repeat(5, 1fr);
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: var(--surface); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-user-select: none; user-select: none;
    }
    body.focus-mode .bottom-nav, body.focus-mode .fab { display: none; }
    .bottom-nav a {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-height: 56px; text-decoration: none; color: var(--muted); font-size: 10.5px;
    }
    .bottom-nav svg { width: 24px; height: 24px; fill: currentColor; stroke: currentColor; }
    .bottom-nav a.active { color: var(--accent); font-weight: 700; }
    .bottom-nav a:active { background: var(--accent-soft); }
    .nav-badge {
      position: absolute; top: 5px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: #d64545; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .nav-badge[hidden] { display: none; }

    .fab {
      display: flex; align-items: center; justify-content: center;
      position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 29;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: var(--surface); box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
    }
    .fab svg { width: 26px; height: 26px; stroke: currentColor; }
    .fab:active { transform: scale(.94); }

    /* 一覧はアプリの行らしく：右端に › 、押したときに沈む */
    .row-card { position: relative; padding-right: 32px; border-radius: 12px; }
    .row-card::after { content: '›'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 22px; }
    .row-card:active, .tile:active, .menu-list a:active, .btn:active { transform: scale(.98); }
    .card, .tile { border-radius: 12px; }

    .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
    body.focus-mode .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
    .form-actions { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }

    /* 一覧の上の「＋登録」ボタンは右下の丸ボタンと重なるので隠す */
    .page-head a[data-go$="/new"], .page-head a[data-go="/scan"] { display: none; }

    /* 絞り込みは「絞り込み」ボタンで開閉する */
    .filters { grid-template-columns: 1fr auto; }

<script>
/**
 * PWA 用の通信部分とログイン画面。
 * 画面本体（src/js.html）は google.script.run を呼ぶ作りなので、それを GAS の API（POST）への fetch に置き換える。
 * ログインしていなければ、呼び出しを待たせてログイン画面を出し、ログインできたら続きを実行する。
 */
(function () {
  'use strict';
  var API = window.__LT_API__;
  var TOKEN_KEY = 'lt_session';
  var queue = [];

  function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { /* 保存できない環境 */ } }

  function post(fn, args) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 事前確認（CORS）の要らない形で送る
      body: JSON.stringify({ fn: fn, args: args, token: getToken() }),
      redirect: 'follow',
    }).then(function (r) {
      if (!r.ok) throw new Error('サーバーに接続できませんでした（' + r.status + '）');
      return r.json();
    });
  }

  function call(fn, args, ok, ng) {
    if (fn !== 'authRedeem' && !getToken()) {
      queue.push([fn, args, ok, ng]);
      showLogin();
      return;
    }
    post(fn, args).then(function (res) {
      if (res.ok) { if (ok) ok(res.result); return; }
      if (res.code === 'AUTH' && fn !== 'authRedeem') {
        setToken(null);
        queue.push([fn, args, ok, ng]);
        showLogin(res.error);
        return;
      }
      if (ng) ng(new Error(res.error || 'エラーが起きました'));
    }, function () {
      if (ng) ng(new Error(navigator.onLine === false ? 'オフラインです。電波のある場所でもう一度お試しください' : '通信できませんでした。少し待ってからもう一度お試しください'));
    });
  }

  function runner(ok, ng) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, ng); },
      withFailureHandler: function (f) { return runner(ok, f); },
    };
    ['apiBootstrap', 'apiSave', 'apiChangeStatus', 'apiMailStatus', 'apiMailDraft', 'apiReadCard',
      'authMe', 'authLogout', 'adminIssueInvite', 'adminListUsers', 'adminRevokeUser'].forEach(function (fn) {
      r[fn] = function () { call(fn, Array.prototype.slice.call(arguments), ok, ng); };
    });
    return r;
  }
  window.google = { script: { run: runner(null, null) } };

  // ===== ログイン画面 =====
  function showLogin(message) {
    var el = document.getElementById('login');
    if (!el) return;
    el.hidden = false;
    document.body.classList.add('logged-out');
    var err = document.getElementById('login-error');
    err.textContent = message || '';
    err.hidden = !message;
    setTimeout(function () { var i = document.getElementById('login-code'); if (i) i.focus(); }, 50);
  }

  function hideLogin() {
    document.getElementById('login').hidden = true;
    document.body.classList.remove('logged-out');
  }

  function deviceLabel() {
    var ua = navigator.userAgent;
    var os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'その他';
    var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
    return os + (standalone ? '（ホーム画面）' : '（ブラウザ）');
  }

  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('login-form');
    var input = document.getElementById('login-code');
    input.addEventListener('input', function () {
      var v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      input.value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v;
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button');
      var err = document.getElementById('login-error');
      btn.disabled = true;
      btn.textContent = '確認中…';
      err.hidden = true;
      call('authRedeem', [input.value, deviceLabel()], function (json) {
        var res = JSON.parse(json);
        setToken(res.token);
        input.value = '';
        btn.disabled = false;
        btn.textContent = 'ログイン';
        hideLogin();
        var q = queue;
        queue = [];
        q.forEach(function (c) { call(c[0], c[1], c[2], c[3]); });
      }, function (e2) {
        btn.disabled = false;
        btn.textContent = 'ログイン';
        err.textContent = e2.message;
        err.hidden = false;
      });
    });
  });

  // 画面本体から使う（メニューのログアウト）
  window.__lt = {
    logout: function () {
      var done = function () { setToken(null); location.hash = ''; location.reload(); };
      call('authLogout', [], done, done);
    },
  };

  // オフラインでも画面の骨組みは出せるようにする（データは保存しない）
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () { /* 失敗しても動作は続ける */ }); });
  }
})();

</script>
<script>
(function () {
  'use strict';

  // ===== 状態 =====
  var S = null;              // サーバーから受け取ったデータ一式
  var IDX = {};              // ID → 行
  var view = document.getElementById('view');
  var listState = {
    inquiries: { q: '', category: '', status: '', assignee: '', sort: 'receivedAt', dir: -1 },
    projects:  { q: '', genre: '', status: '', assignee: '', sort: 'updatedAt', dir: -1 },
  };
  var resultsYear = null;

  // ===== ユーティリティ =====
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function dash(v) { return v === '' || v == null ? '—' : esc(v); }
  function num(n) { return typeof n === 'number' ? n.toLocaleString('ja-JP') : '—'; }
  function yen(n) { return typeof n === 'number' ? n.toLocaleString('ja-JP') + '円' : '—'; }
  function dateOnly(s) { return s ? String(s).slice(0, 10) : ''; }
  function by(key) { var m = {}; return function (rows) { rows.forEach(function (r) { m[r[key]] = r; }); return m; }; }
  function group(rows, key) {
    var m = {};
    rows.forEach(function (r) { (m[r[key]] = m[r[key]] || []).push(r); });
    return m;
  }
  function uniq(arr) { return arr.filter(function (v, i) { return v && arr.indexOf(v) === i; }); }

  var STATUS_CLASS = {
    '新規相談': 'st-consult', '内容確認中': 'st-consult', 'ロケ地提案・調整中': 'st-consult', '撮影条件確認中': 'st-consult',
    '撮影決定': 'st-decided', '撮影準備中': 'st-decided',
    '撮影実施済み': 'st-shot', '実績確認・公開確認中': 'st-shot',
    '完了': 'st-done', '保留': 'st-hold', '見送り': 'st-stop', '中止': 'st-stop',
    // 問い合わせ
    '新規': 'st-decided', '対応中': 'st-consult', '回答済み': 'st-shot', '対応不要': 'st-hold',
    // 公開状況
    '未公開': 'st-consult', '公開予定': 'st-decided', '公開済み': 'st-shot', '公開見送り': 'st-stop', '不明': 'st-hold',
  };
  function badge(status) {
    if (!status) return '<span class="badge st-hold">未設定</span>';
    return '<span class="badge ' + (STATUS_CLASS[status] || 'st-hold') + '">' + esc(status) + '</span>';
  }

  var PROJECT_GROUPS = {
    __active: { label: '進行中（完了・保留・見送り・中止を除く）', list: ['新規相談', '内容確認中', 'ロケ地提案・調整中', '撮影条件確認中', '撮影決定', '撮影準備中', '撮影実施済み', '実績確認・公開確認中'] },
    __decided: { label: '撮影決定（決定・準備中）', list: ['撮影決定', '撮影準備中'] },
    __shot: { label: '撮影実施（実施済み以降）', list: ['撮影実施済み', '実績確認・公開確認中', '完了'] },
  };
  var INQUIRY_GROUPS = {
    __open: { label: '未対応（新規・対応中）', list: ['新規', '対応中'] },
  };
  function matchStatus(status, filter, groups) {
    if (!filter) return true;
    if (groups[filter]) return groups[filter].list.indexOf(status) >= 0;
    return status === filter;
  }

  function options(values, selected, allLabel, groups) {
    var html = '<option value="">' + esc(allLabel) + '</option>';
    if (groups) {
      Object.keys(groups).forEach(function (k) {
        html += '<option value="' + k + '"' + (k === selected ? ' selected' : '') + '>' + esc(groups[k].label) + '</option>';
      });
    }
    values.forEach(function (v) {
      html += '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    return html;
  }

  function compare(a, b, key, dir) {
    var x = a[key], y = b[key];
    var ex = x === '' || x == null, ey = y === '' || y == null;
    if (ex && ey) return 0;
    if (ex) return 1;          // 空欄は向きにかかわらず最後
    if (ey) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y), 'ja') * dir;
  }

  function sortHeader(table, key, label, cls) {
    var st = listState[table];
    var arrow = st.sort === key ? (st.dir > 0 ? '▲' : '▼') : '';
    var aria = st.sort === key ? (st.dir > 0 ? 'ascending' : 'descending') : 'none';
    return '<th class="' + (cls || '') + '" aria-sort="' + aria + '"><button type="button" data-sort="' + table + ':' + key + '">' +
      esc(label) + '<span class="arrow">' + arrow + '</span></button></th>';
  }

  // ===== 画面遷移 =====
  var hasHistory = typeof google !== 'undefined' && google.script && google.script.history;

  function go(route) {
    if (hasHistory) {
      google.script.history.push({ route: route }, null, route);
      render(route);
    } else if (location.hash !== '#' + route) {
      location.hash = route;   // hashchange で render
    } else {
      render(route);
    }
    window.scrollTo(0, 0);
  }

  function parseRoute(route) {
    var r = String(route || '/').replace(/^#/, '');
    if (r.charAt(0) !== '/') r = '/' + r;
    var q = {};
    var i = r.indexOf('?');
    if (i >= 0) {
      r.slice(i + 1).split('&').forEach(function (kv) {
        var p = kv.split('=');
        if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      r = r.slice(0, i);
    }
    return { parts: r.split('/').filter(Boolean), query: q };
  }

  function render(route) {
    if (!S) return;
    var rt = parseRoute(route);
    var p = rt.parts;
    var tab = p[0] || 'dashboard';
    Array.prototype.forEach.call(document.querySelectorAll('.tabs a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-tab') === tab);
      if (a.getAttribute('data-tab') === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    if (tab === 'edit') {
      var parent = { inquiries: 'inquiries', projects: 'projects', scouts: 'scouts', contacts: 'contacts', locations: 'master', companies: 'master' }[p[1]] || 'projects';
      Array.prototype.forEach.call(document.querySelectorAll('.tabs a'), function (a) {
        a.classList.toggle('active', a.getAttribute('data-tab') === parent);
      });
    }

    updateAppShell(tab, p);
    if (tab !== 'scan') stopCamera();
    if (tab === 'mail') {
      Array.prototype.forEach.call(document.querySelectorAll('.tabs a'), function (a) {
        a.classList.toggle('active', a.getAttribute('data-tab') === 'inquiries');
      });
    }
    if (tab === 'scan') {
      Array.prototype.forEach.call(document.querySelectorAll('.tabs a'), function (a) {
        a.classList.toggle('active', a.getAttribute('data-tab') === 'contacts');
      });
    }

    try {
      if (tab === 'menu') return renderMenu();
      if (tab === 'users') return renderUsers();
      if (tab === 'mail' && p[1]) return renderMailDetail(p[1]);
      if (tab === 'mail') return renderMailList(rt.query);
      if (tab === 'scan') return renderScan();
      if (tab === 'contacts') return renderContacts();
      if (tab === 'edit') return renderForm(p[1], p[2] || 'new', rt.query);
      if (tab === 'master') return renderMaster();
      if (tab === 'scouts' && p[1]) return renderScoutDetail(p[1]);
      if (tab === 'scouts') return renderScouts();
      if (tab === 'inquiries' && p[1]) return renderInquiryDetail(p[1]);
      if (tab === 'inquiries') { applyQuery('inquiries', rt.query); return renderInquiries(); }
      if (tab === 'projects' && p[1]) return renderProjectDetail(p[1]);
      if (tab === 'projects') { applyQuery('projects', rt.query); return renderProjects(); }
      if (tab === 'results') return renderResults();
      return renderDashboard();
    } catch (e) {
      view.innerHTML = '<div class="error">画面の表示中にエラーが起きました：' + esc(e.message) + '</div>';
      throw e;
    }
  }

  function applyQuery(table, q) {
    if (!q || Object.keys(q).length === 0) return;
    var st = listState[table];
    ['q', 'category', 'genre', 'status', 'assignee'].forEach(function (k) {
      if (k in st) st[k] = q[k] || '';
    });
  }

  // ===== ダッシュボード（仕様 8-1） =====
  function renderDashboard() {
    var d = S.stats.dashboard;
    var newMails = S.data.mailInbox.filter(function (m) { return m.status === '未確認'; }).length;
    var tiles = [
      ['新着メール（未確認）', newMails, '件', '/mail', newMails > 0],
      ['総問い合わせ件数', d.inquiriesTotal, '件', '/inquiries?status=', false],
      ['新規問い合わせ', d.inquiriesNew, '件', '/inquiries?status=新規', d.inquiriesNew > 0],
      ['未対応', d.inquiriesOpen, '件', '/inquiries?status=__open', d.inquiriesOpen > 0],
      ['進行中の案件', d.projectsActive, '件', '/projects?status=__active', false],
      ['撮影決定', d.projectsDecided, '件', '/projects?status=__decided', false],
      ['撮影実施', d.projectsShot, '件', '/projects?status=__shot', false],
      ['完了した案件', d.projectsDone, '件', '/projects?status=完了', false],
    ];
    var html = '<h1>ダッシュボード</h1>';
    if (S.issues && S.issues.length) {
      html += '<a class="issue-banner" href="#" data-go="/master">シートに確認が必要な行が ' + S.issues.length + ' 件あります（直接編集した行など）→ 確認する</a>';
    }
    html += '<div class="tiles">';
    tiles.forEach(function (t) {
      html += '<a class="tile' + (t[4] ? ' attention' : '') + '" href="#" data-go="' + esc(t[3]) + '">' +

    html += '<section class="card"><h2>年度別の撮影実績</h2><div style="overflow-x:auto"><table><thead><tr>' +
      '<th>年度</th><th class="num">撮影件数</th><th class="num">撮影日数</th><th class="num">参加人数</th><th class="num">延べ宿泊数</th><th class="num">公開済み</th>' +
      '</tr></thead><tbody>';

      var r = S.stats.results[fy];
      html += '<tr data-go="/results" data-year="' + fy + '"><td class="nowrap">' + fy + '年度' + (fy === S.stats.currentFy ? '（今年度）' : '') + '</td>' +

        '<td class="num">' + num(r.lodgingNights) + '</td><td class="num">' + num(r.released) + '</td></tr>';
    });
    html += '</tbody></table></div><p class="note">年度は4月始まり。撮影件数は撮影実績が登録された案件の数。</p></section>';

    // 直近の予定（ロケハン・撮影）
    var upcoming = [];
    S.data.shootPlans.forEach(function (p) {
      if (!p.shootDate || p.shootDate < S.today) return;
      var pr = IDX.projects[p.projectId] || {};
      if (['見送り', '中止'].indexOf(pr.status) >= 0) return;
      upcoming.push({ date: p.shootDate, kind: '撮影', route: '/projects/' + p.projectId, title: pr.title || p.projectId, time: p.shootTime, places: locationNamesOfPlan(p.id) });
    });
    S.data.scouts.forEach(function (s) {
      if (!s.scoutDate || s.scoutDate < S.today || s.status !== '予定') return;
      upcoming.push({ date: s.scoutDate, kind: 'ロケハン', route: '/scouts/' + s.id, title: scoutName(s), time: s.scoutTime, places: scoutLocationNames(s.id) });
    });
    upcoming.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    html += '<div class="grid-2"><section class="card"><h2>直近の予定（ロケハン・撮影）</h2>';

        '<div class="meta">' + dash(u.time) + '／' + esc(u.places.join('・') || 'ロケ地未定') + '</div></div>';

    var open = S.data.inquiries.filter(function (i) { return INQUIRY_GROUPS.__open.list.indexOf(i.status) >= 0; })
      .sort(function (a, b) { return compare(a, b, 'receivedAt', -1); }).slice(0, 5);
    html += '<section class="card"><h2>未対応の問い合わせ</h2>';
    if (open.length === 0) html += '<p class="empty">ありません</p>';
    open.forEach(function (i) {
      html += '<div class="item"><a href="#" data-go="/inquiries/' + esc(i.id) + '">' + esc(i.title || '（作品名なし）') + '</a> ' + badge(i.status) +

    });
    html += '</section></div>';

    view.innerHTML = html;
  }

    var acts = (G.activitiesByProject[id] || []).slice().sort(function (a, b) { return compare(a, b, 'actedAt', -1); });
    var plans = (G.plansByProject[id] || []).slice().sort(function (a, b) { return compare(a, b, 'shootDate', 1); });
    var results = (G.resultsByProject[id] || []).slice().sort(function (a, b) { return compare(a, b, 'shootDate', 1); });
    var history = (G.historyByTarget[id] || []).slice().sort(function (a, b) { return compare(a, b, 'changedAt', -1); });

      '<div class="detail-head"><h1>' + esc(p.title) + '</h1>' + badge(p.status) + '</div>' +

  // ===== 撮影実績（仕様 8-5） =====
  function renderResults() {

    if (keys.indexOf(String(resultsYear)) < 0) resultsYear = 'all';
    var r = S.stats.results[resultsYear];

    var html = '<h1>撮影実績</h1><div class="year-select" role="group" aria-label="年度">';
    keys.forEach(function (k) {
      html += '<button type="button" data-year="' + k + '" aria-pressed="' + (String(resultsYear) === k) + '">' + (k === 'all' ? '全期間' : k + '年度') + '</button>';
    });
    html += '</div>';

    var tiles = [
      ['撮影件数', r.shoots, '件'], ['撮影日数', r.days, '日'], ['参加人数', r.participants, '名'], ['公開済み作品', r.released, '作品'],
      ['宿泊人数', r.lodgers, '名'], ['延べ宿泊数', r.lodgingNights, '泊'], ['ロケ弁', r.bento, '食'],
    ];
    html += '<div class="tiles">';
    tiles.forEach(function (t) {
      html += '<div class="tile"><div class="label">' + t[0] + '</div><div class="value">' + num(t[1]) + '<span class="unit">' + t[2] + '</span></div></div>';

      '<div class="label">推計 ' + yen(r.effectEstimated) + (r.effectMissing ? '／未取得 ' + r.effectMissing + '件' : '') + '</div></div>';
    html += '</div>';

    html += '<div class="grid-2"><section class="card"><h2>ジャンル別の撮影件数</h2>' + bars(r.byGenre) + '</section>' +
      '<section class="card"><h2>ロケ地別の撮影件数</h2>' + bars(r.byLocation) +
      '<p class="note">1つの案件で複数のロケ地を使った場合は、それぞれに1件ずつ数える。</p></section></div>';

    var rows = S.data.results.filter(function (x) { return resultsYear === 'all' || fyOf(x.shootDate) === Number(resultsYear); })

    else {
      html += '<div style="overflow-x:auto"><table><thead><tr><th>撮影日</th><th>作品名</th><th class="num">日数</th><th class="num">参加</th><th class="num">延べ宿泊</th><th>公開状況</th><th class="num">経済効果</th><th>区分</th></tr></thead><tbody>';
      rows.forEach(function (x) {
        var pr = IDX.projects[x.projectId] || {};
        html += '<tr data-go="/projects/' + esc(x.projectId) + '"><td class="nowrap">' + esc(x.shootDate) + '</td><td>' + esc(pr.title || x.projectId) + '</td>' +
          '<td class="num">' + num(x.days) + '</td><td class="num">' + num(x.participants) + '</td><td class="num">' + num(x.lodgingNights) + '</td>' +
          '<td class="nowrap">' + dash(x.releaseStatus) + '</td><td class="num nowrap">' + yen(x.economicEffect) + '</td><td class="nowrap">' + dash(x.figureType) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<p class="note">経済効果は「実測」と「推計」を分けて合計し、「未取得」は合計に含めない。</p></section>';

    view.innerHTML = html;
  }

  function fyOf(s) {
    var m = /^(\d{4})[\/-](\d{1,2})/.exec(String(s || ''));
    if (!m) return null;
    return Number(m[2]) >= 4 ? Number(m[1]) : Number(m[1]) - 1;
  }

  function bars(list) {
    if (!list.length) return '<p class="empty">データがありません</p>';
    var max = Math.max.apply(null, list.map(function (x) { return x.count; }));
    return '<ul class="bars">' + list.map(function (x) {
      return '<li><span>' + esc(x.name) + '</span><span class="bar" style="width:' + Math.round(x.count / max * 100) + '%"></span><span class="n">' + x.count + '</span></li>';
    }).join('') + '</ul>';
  }

  // ===== 共通の部品 =====
  /** スマホで絞り込みの選択欄を開閉するボタン（PCでは出さない）。絞り込み中なら印を付ける */
  function filterToggle(active) {
    return '<button type="button" class="btn filter-toggle' + (active ? ' filter-on' : '') + '" data-action="toggle-filters" aria-expanded="false">絞り込み' + (active ? '●' : '') + '</button>';
  }
  function pageHead(title, buttons) {
    return '<div class="page-head"><h1>' + esc(title) + '</h1><div>' + (buttons || '') + '</div></div>';
  }
  function secHead(title, addRoute) {
    return '<div class="sec-head"><h2>' + esc(title) + '</h2>' +
      (addRoute ? '<a class="btn btn-small" href="#" data-go="' + esc(addRoute) + '">＋ 追加</a>' : '') + '</div>';
  }
  function editLink(table, id) {
    // 番号が重複している行は、どちらの行を開くか決められないので編集リンクを出さない（データ点検で知らせる）
    if (S.data[table] && S.data[table].filter(function (r) { return r.id === id; }).length !== 1) {
      return '<span class="edit-link note" style="margin:0">番号重複のため編集不可</span>';
    }
    return '<a class="edit-link" href="#" data-go="/edit/' + table + '/' + esc(id) + '" aria-label="' + esc(id) + ' を編集">編集</a>';
  }
  /** パスと値から画面遷移先を作る。空の値は付けない */
  function link(path, params) {
    var q = Object.keys(params || {}).filter(function (k) {
      return params[k] !== '' && params[k] != null;
    }).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); });
    return q.length ? path + '?' + q.join('&') : path;
  }
  function statusChanger(table, id, current, list) {
    return '<span class="status-change"><label for="status-select" class="sr-only">ステータス</label>' +
      '<select id="status-select">' + list.map(function (s) {
        return '<option value="' + esc(s) + '"' + (s === current ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('') + '</select><button type="button" class="btn" data-action="change-status" data-table="' + table + '" data-id="' + esc(id) + '">ステータス変更</button></span>';
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');

    el.textContent = msg;

    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3000);

  // ===== スマホ用の外枠（下のタブバー・右下ボタン・メニュー） =====
  var NAV_OF = {
    dashboard: 'home', inquiries: 'inquiries', mail: 'inquiries', projects: 'projects',
    contacts: 'contacts', scan: 'contacts', scouts: 'menu', results: 'menu', master: 'menu', menu: 'menu', users: 'menu',
  };
  var EDIT_NAV_OF = { inquiries: 'inquiries', activities: 'projects', projects: 'projects', scouts: 'menu', shootPlans: 'projects', results: 'projects', contacts: 'contacts', locations: 'menu', companies: 'menu' };

  function updateAppShell(tab, p) {
    var nav = tab === 'edit' ? (EDIT_NAV_OF[p[1]] || 'home') : (NAV_OF[tab] || 'home');
    Array.prototype.forEach.call(document.querySelectorAll('.bottom-nav a'), function (a) {
      var on = a.getAttribute('data-nav') === nav;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    // 入力・撮影の画面では下のタブバーを隠して、作業に集中できるようにする
    document.body.classList.toggle('focus-mode', tab === 'edit' || tab === 'scan');

    if (badge && S) {
      var n = S.data.mailInbox.filter(function (m) { return m.status === '未確認'; }).length + S.stats.dashboard.inquiriesNew;
      badge.textContent = n > 99 ? '99+' : String(n);
      badge.hidden = n === 0;

      '<div class="field"><label for="inv-role">役割</label><select id="inv-role"><option value="editor">編集者（登録・編集ができる）</option><option value="viewer">閲覧のみ</option><option value="admin">管理者（利用者の管理もできる）</option></select></div>' +

          (u.self ? '' : '<div class="actions" style="margin:6px 0 0"><button type="button" class="btn btn-small" data-action="revoke-user" data-email="' + esc(u.email) + '">取り消す</button></div>') + '</div>';

  // ===== 新着メール（Phase 7-1：受信箱） =====
  var MAIL_CLASS = { '未確認': 'st-decided', '問い合わせ登録済み': 'st-shot', '対応履歴に追加済み': 'st-shot', '対象外': 'st-hold' };

  function mailBadge(s) { return '<span class="badge ' + (MAIL_CLASS[s] || 'st-hold') + '">' + esc(s) + '</span>'; }

  function renderMailList(query) {
    var showAll = query && query.all === '1';
    var rows = S.data.mailInbox.filter(function (m) { return showAll || m.status === '未確認'; })
      .sort(function (a, b) { return compare(a, b, 'receivedAt', -1); });
    var html = '<a class="back" href="#" data-go="/inquiries">← 問い合わせ一覧</a>' +
      pageHead('新着メール', '<a class="btn btn-small" href="#" data-go="' + (showAll ? '/mail' : '/mail?all=1') + '">' + (showAll ? '未確認だけ表示' : 'すべて表示') + '</a>') +
      '<p class="note" style="margin-top:0">窓口アドレスに届いたメールです。1件ずつ確認して、問い合わせとして登録するか、既存案件の対応履歴にするか、対象外にしてください。</p>' +
      '<div class="count">' + rows.length + '件</div><ul class="list">';
    if (!rows.length) html += '<li class="empty">' + (showAll ? 'メールはありません' : '未確認のメールはありません') + '</li>';
    rows.forEach(function (m) {
      html += '<li><a class="row-card" href="#" data-go="/mail/' + esc(m.id) + '"><div class="top"><span class="title">' + esc(m.subject || '（件名なし）') + '</span>' + mailBadge(m.status) + '</div>' +
        '<div class="meta">' + esc(m.receivedAt) + '／' + esc(m.fromName || m.fromEmail) + (m.attachments ? '／添付あり' : '') + '</div>' +
        '<div class="meta">' + esc(String(m.body || '').replace(/\s+/g, ' ').slice(0, 80)) + '</div></a></li>';
    });
    view.innerHTML = html + '</ul>';
  }

  /** 同じスレッドのメールが過去に登録されていれば、その案件・問い合わせを候補として返す */
  function mailCandidates(m) {
    var out = { projectId: '', inquiryId: '', reason: '' };
    S.data.mailInbox.forEach(function (x) {
      if (x.id === m.id || !m.threadId || x.threadId !== m.threadId || !x.targetId) return;
      var inq = IDX.inquiries[x.targetId];
      var act = S.data.activities.filter(function (a) { return a.id === x.targetId; })[0];
      if (inq) { out.inquiryId = inq.id; out.projectId = inq.projectId || out.projectId; out.reason = '同じやり取り（' + x.id + '）を ' + inq.id + ' として登録済み'; }
      else if (act) { out.projectId = act.projectId || out.projectId; out.inquiryId = act.inquiryId || out.inquiryId; out.reason = '同じやり取り（' + x.id + '）を対応履歴 ' + act.id + ' に追加済み'; }
    });
    if (!out.reason && m.fromEmail) {
      var c = S.data.contacts.filter(function (x) { return x.email && x.email.toLowerCase() === m.fromEmail.toLowerCase(); })[0];
      if (c) out.reason = '差出人は連絡先 ' + c.id + '（' + c.name + '／' + (c.companyName || '所属なし') + '）';
    }
    return out;
  }

  /** 差出人から会社名を推定する：連絡先のメール一致 → 制作会社マスタのドメイン一致 */
  function guessCompanyFromMail(m) {
    var email = String(m.fromEmail || '').toLowerCase();
    var c = S.data.contacts.filter(function (x) { return x.email && x.email.toLowerCase() === email; })[0];
    if (c && c.companyName) return c.companyName;
    var domain = email.split('@')[1] || '';
    var hit = S.data.companies.filter(function (x) { return x.email && x.email.toLowerCase().split('@')[1] === domain; })[0];
    return hit ? hit.name : '';
  }

  function renderMailDetail(id) {
    var m = S.data.mailInbox.filter(function (x) { return x.id === id; })[0];
    if (!m) { view.innerHTML = '<a class="back" href="#" data-go="/mail">← 新着メール</a><p class="error">受信メール ' + esc(id) + ' が見つかりません</p>'; return; }
    var cand = mailCandidates(m);
    var html = '<a class="back" href="#" data-go="/mail">← 新着メール</a>' +
      '<div class="detail-head"><h1>' + esc(m.subject || '（件名なし）') + '</h1>' + mailBadge(m.status) + '</div>' +
      '<div class="sub">' + esc(m.id) + '／受信 ' + esc(m.receivedAt) + '</div>';

    if (m.status === '未確認') {
      html += '<div class="actions">' +
        '<a class="btn' + (cand.projectId || cand.inquiryId ? '' : ' btn-primary') + '" href="#" data-go="' + esc(link('/edit/inquiries/new', { _fromMailId: m.id })) + '">問い合わせとして登録</a>' +
        '<a class="btn' + (cand.projectId || cand.inquiryId ? ' btn-primary' : '') + '" href="#" data-go="' +
        esc(link('/edit/activities/new', { _fromMailId: m.id, projectId: cand.projectId, inquiryId: cand.inquiryId })) + '">既存案件の対応履歴にする</a>' +
        '<button type="button" class="btn" data-action="mail-status" data-mail="' + esc(m.id) + '" data-op="ignore">対象外にする</button></div>';
      if (cand.reason) html += '<div class="next-action"><div class="label">候補</div>' + esc(cand.reason) +
        (cand.projectId ? '　→ <a href="#" data-go="/projects/' + esc(cand.projectId) + '">' + esc(cand.projectId) + ' ' + esc((IDX.projects[cand.projectId] || {}).title || '') + '</a>' : '') + '</div>';
    } else {
      var target = m.targetId ? (IDX.inquiries[m.targetId] ? '/inquiries/' + m.targetId : null) : null;
      if (!target && m.targetId) {

      }
      html += '<div class="card">' + esc(m.status) + (m.targetId ? '：' + (target ? '<a href="#" data-go="' + esc(target) + '">' + esc(m.targetId) + '</a>' : esc(m.targetId)) : '') +
        (m.handledAt ? '<div class="meta">' + esc(m.handledAt) + '　' + esc(m.handledBy) + '</div>' : '') +
        (m.status === '対象外' ? '<div class="actions" style="margin:8px 0 0"><button type="button" class="btn btn-small" data-action="mail-status" data-mail="' + esc(m.id) + '" data-op="reopen">未確認に戻す</button></div>' : '') + '</div>';
    }

    html += mailAiSection(m);

    html += '<section class="card"><dl class="kv"><dt>差出人</dt><dd>' + esc(m.fromName) + ' &lt;' + esc(m.fromEmail) + '&gt;</dd>' +
      '<dt>添付</dt><dd>' + dash(m.attachments) + (m.attachments ? '<div class="note" style="margin:2px 0 0">添付ファイルは窓口アドレスのGmailで確認してください</div>' : '') + '</dd></dl>' +
      '<div class="mail-body">' + esc(m.body) + '</div></section>';
    view.innerHTML = html;

  function mailAiExtract(m) {
    try { return m.aiExtract ? JSON.parse(m.aiExtract) : null; } catch (e) { return null; }
  }

  /** AI 下書きの表示（作成ボタン・分類案・要約・不足情報・返信案） */
  function mailAiSection(m) {
    var hasAi = !!(m.aiCategory || m.aiSummary);
    var html = '<section class="card ai-card"><div class="sec-head"><h2>AI下書き</h2>' +
      (m.status === '未確認' ? '<button type="button" class="btn btn-small" data-action="mail-draft" data-mail="' + esc(m.id) + '">' + (hasAi ? '作り直す' : 'AIで下書きを作る') + '</button>' : '') + '</div>';
    if (!hasAi) {
      return html + '<p class="empty" style="margin:0">まだ作っていません。分類・要約・足りない情報・返信の文案をAIが下書きします（電話番号・メールアドレスは伏せて送ります）。</p></section>';
    }
    var ex = mailAiExtract(m) || {};
    var rows = [['分類案', m.aiCategory], ['作品名', ex.title], ['会社', ex.companyName], ['担当者', ex.contactName], ['撮影時期', ex.shootPeriod], ['人数', ex.headcount], ['希望', ex.locationWishes]]
      .filter(function (r) { return r[1]; });
    html += '<p class="note" style="margin-top:0">AIの推定です。間違いがあり得るので、必ず本文と見比べてください。</p>';
    if (m.aiCategory === '対象外候補') html += '<div class="next-action" style="margin-bottom:12px"><div class="label">AIの判断</div>撮影の相談ではない（営業・お知らせなど）ようです。問題なければ「対象外にする」を押してください。</div>';
    html += '<dl class="kv">' + rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>';
    if (m.aiSummary) html += '<h3 class="ai-h">要約</h3><div class="mail-body" style="border:0;margin:0;padding:0">' + esc(m.aiSummary) + '</div>';
    if (m.aiMissing) html += '<h3 class="ai-h">足りない情報</h3><ul class="ai-list">' + m.aiMissing.split('\n').map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (m.aiReply) {
      html += '<div class="sec-head" style="margin-top:12px"><h3 class="ai-h" style="margin:0">返信の文案</h3>' +
        '<button type="button" class="btn btn-small" data-action="copy-reply">コピー</button></div>' +
        '<textarea id="ai-reply" class="ai-reply" rows="10" aria-label="返信の文案（編集してからコピーできます）">' + esc(m.aiReply) + '</textarea>' +
        '<p class="note">直してからコピーし、窓口アドレスのGmailで返信してください（アプリからは送信しません）。</p>';
    }
    return html + '</section>';
  }

  /** 受信メールから登録フォームの初期値を作る（URL には載せない）。AI 下書きがあれば使う */
  function prefillFromMail(table, mailId) {
    var m = S.data.mailInbox.filter(function (x) { return x.id === mailId; })[0];
    if (!m) return {};
    var body = String(m.body || '');
    var ex = mailAiExtract(m) || {};
    if (table === 'inquiries') {
      var cat = S.enums['問い合わせ分類'].indexOf(m.aiCategory) >= 0 ? m.aiCategory : '';
      return {
        receivedAt: m.receivedAt, channel: 'メール', contactName: ex.contactName || m.fromName, email: m.fromEmail,
        companyName: guessCompanyFromMail(m) || ex.companyName || '', title: ex.title || '', category: cat,
        body: (m.subject ? '件名：' + m.subject + '\n\n' : '') + body.slice(0, 3000),
      };
    }
    if (table === 'activities') {
      return { actedAt: m.receivedAt, method: 'メール', content: '【受信】' + (m.subject || '') + '\n' + (m.aiSummary ? '（要約）' + m.aiSummary : body.slice(0, 1500)) };
    }
    return {};
  }

  // ===== 連絡先（名刺） =====
  var contactQuery = '';

  function renderContacts() {
    var html = pageHead('連絡先', '<a class="btn btn-primary" href="#" data-go="/scan">名刺を撮る</a> <a class="btn" href="#" data-go="/edit/contacts/new">＋ 手入力</a>') +
      '<div class="filters" role="search" style="grid-template-columns:1fr"><input type="search" id="contact-q" placeholder="氏名・会社・部署・メールで検索" value="' + esc(contactQuery) + '" aria-label="キーワード"></div>' +
      '<div id="contact-list"></div>';
